name: Recovery Build (Legacy)

on:
  push:
    branches:
      - main  # 実行するブランチを指定

env:
  MANIFEST_URL: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni'
  MANIFEST_BRANCH: 'twrp-9.0'
  DEVICE_TREE_URL: 'https://github.com/coara-chocomaru/rk3399.-twrp'
  DEVICE_TREE_BRANCH: 'main'
  DEVICE_PATH: 'device/gsl/zmooth'
  DEVICE_NAME: 'zmooth'
  MAKEFILE_NAME: 'zmooth_twrp'
  BUILD_TARGET: 'recovery'
  
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      MANIFEST_URL: ${{ github.event.inputs.MANIFEST_URL }}
      MANIFEST_BRANCH: ${{ github.event.inputs.MANIFEST_BRANCH }}
      DEVICE_TREE_URL: ${{ github.event.inputs.DEVICE_TREE_URL }}
      DEVICE_TREE_BRANCH: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
      DEVICE_PATH: ${{ github.event.inputs.DEVICE_PATH }}
      DEVICE_NAME: ${{ github.event.inputs.DEVICE_NAME }}
      MAKEFILE_NAME: ${{ github.event.inputs.MAKEFILE_NAME }}
      BUILD_TARGET: ${{ github.event.inputs.BUILD_TARGET }}
      HOST_OUT: ${{ github.workspace }}/workspace/out/host/linux-x86
      TARGET_OUT: ${{ github.workspace }}/workspace/out/target/product

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Slim runner
        uses: rokibhasansagar/slimhub_actions@main

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential \
            zip curl zlib1g-dev libc6-dev-i386 \
            libncurses5 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc \
            unzip python2 python3 bc schedtool pngcrush ccache
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Configure ccache
        run: |
          ccache --max-size=8G
          ccache --zero-stats
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_EXEC=/usr/bin/ccache" >> $GITHUB_ENV
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Setup repo
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync TWRP source
        run: |
          mkdir workspace && cd workspace
          repo init --depth=1 \
            -u $MANIFEST_URL \
            -b $MANIFEST_BRANCH \
            --no-tags \
            --no-clone-bundle \
            -g default,-mips,-darwin,-notdefault
          repo sync \
            -j$(nproc --all) \
            --force-sync \
            --no-tags \
            --no-clone-bundle \
            --optimized-fetch \
            --prune \
            -c

      - name: Clone device tree
        run: |
          git clone \
            --depth=1 \
            -b $DEVICE_TREE_BRANCH \
            $DEVICE_TREE_URL \
            workspace/$DEVICE_PATH

      - name: Setup swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Build recovery
        run: |
          cd workspace
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch $MAKEFILE_NAME-eng
          make $BUILD_TARGET -j$(nproc --all) 2>&1 | tee $GITHUB_WORKSPACE/build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "Build failed"
            exit 1
          fi

      - name: Package bin
        run: |
          cd "$HOST_OUT"
          zip -r $GITHUB_WORKSPACE/bin.zip bin/
          echo "fec: $(find bin/ -name fec -type f)"
          echo "avbtool: $(find bin/ -name avbtool -type f)"
          ls -lh $GITHUB_WORKSPACE/bin.zip

      - name: Collect artifacts
        id: artifacts
        run: |
          IMG=$TARGET_OUT/$DEVICE_NAME/$BUILD_TARGET.img
          echo "img=$IMG" >> $GITHUB_OUTPUT
          echo "sha256=$(sha256sum $IMG | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "date=$(date +%Y%m%d)" >> $GITHUB_OUTPUT
          ls -lh $IMG

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.DEVICE_NAME }}-${{ steps.artifacts.outputs.date }}-${{ github.run_number }}
          name: "TWRP ${{ env.DEVICE_NAME }} ${{ steps.artifacts.outputs.date }}"
          body: |
            Device: ${{ env.DEVICE_NAME }}
            Manifest: ${{ env.MANIFEST_BRANCH }}
            SHA256: ${{ steps.artifacts.outputs.sha256 }}
          files: |
            ${{ steps.artifacts.outputs.img }}
            ${{ github.workspace }}/bin.zip
            ${{ github.workspace }}/build.log
